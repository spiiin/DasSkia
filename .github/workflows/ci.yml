name: Desktop and Web strict AOT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-web:
    name: Windows desktop + WebAssembly (clean, strict AOT)
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      EMSDK_QUIET: '1'
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.4'
      - name: Install validated AOT Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.3.0'
      - name: Install pinned build and browser tools
        run: |
          python -m pip install -r ci/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing CI requirements failed' }
          python -m playwright install chromium firefox
          if ($LASTEXITCODE -ne 0) { throw 'Installing browser binaries failed' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("DASSKIA_NODE=" + (Get-Command node).Source)
          python tools/ci.py lint
      - name: Bootstrap from empty dependency and build directories
        run: python tools/ci.py bootstrap
      - name: Build desktop and native strict AOT
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python tools/ci.py build-desktop
      - name: Test desktop with verified software OpenGL
        run: python tools/ci.py test-desktop
      - name: Install pinned Emscripten SDK
        run: python tools/ci.py setup-emsdk
      - name: Build web interpreter and actual wasm32 strict AOT
        run: python tools/ci.py build-web
      - name: Test Chromium and Firefox, interpreter and strict AOT
        run: python tools/ci.py test-web
      - name: Prepare strict AOT demo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python tools/prepare_pages.py
      - name: Upload strict AOT Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web/aot-site
      - name: Upload logs, JUnit, diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: |
            build/logs/
            build/browser-tests/
            build/desktop/Testing/Temporary/
            build/skia-native/args.gn
            build/skia-web/args.gn
            build/desktop/CMakeCache.txt
            build/web/CMakeCache.txt

  pages:
    name: Publish strict AOT demo
    needs: desktop-web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy strict AOT artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify published revision
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = os.environ['PAGES_URL'].rstrip('/') + '/build.json'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url + '?revision=' + os.environ['EXPECTED_SHA'], timeout=15) as response:
                      info = json.load(response)
                  if info['commit'] == os.environ['EXPECTED_SHA'] and info['strict_aot'] is True:
                      print('Published strict AOT revision:', info['commit'])
                      break
              except (OSError, ValueError, KeyError):
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Published Pages revision did not match this build')
          PY
